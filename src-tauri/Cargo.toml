[package]
name = "vystriq"
version = "0.1.0"
description = "Local-first focus and productivity desktop application"
authors = ["VYSTRIQ"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "vystriq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
