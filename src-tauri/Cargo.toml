[package]
name = "vystriq"
version = "0.4.0"
description = "Local-first focus and productivity desktop application"
authors = ["VYSTRIQ"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "vystriq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
url = "2"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-plugin-notification = "2"
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Media_Audio"] }

[dev-dependencies]
tempfile = "3"
