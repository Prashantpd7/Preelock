[[permission]]
identifier = "read-state"
description = "Read local application state."
commands.allow = ["snapshot", "block_attempts"]

[[permission]]
identifier = "change-state"
description = "Mutate validated local tasks, preferences and Focus Sessions."
commands.allow = ["execute"]

[[permission]]
identifier = "read-capabilities"
description = "Read native capability availability."
commands.allow = ["capabilities"]

[[permission]]
identifier = "focus-setup"
description = "Inspect running app choices, camera consent and local browser pairing."
commands.allow = ["focus_setup"]

[[permission]]
identifier = "camera-consent"
description = "Request camera permission after an explicit user action."
commands.allow = ["request_camera"]

[[permission]]
identifier = "browser-pairing-reset"
description = "Reset local browser pairing only when no session is active."
commands.allow = ["reset_browser_pairing"]

[[permission]]
identifier = "open-setup"
description = "Open the extension folder, selected supported browser extensions, or camera settings."
commands.allow = ["open_setup"]

[[permission]]
identifier = "settings-tools"
description = "Manage local settings, explicit camera tests, native file dialogs and notifications."
commands.allow = ["settings_action"]

[[permission]]
identifier = "read-app-icons"
description = "Read installed apps' icons for the Screen Time list."
commands.allow = ["get_app_icon"]

[[permission]]
identifier = "dismiss-blocked-app"
description = "Dismiss the informational blocked-app page."
commands.allow = ["dismiss_blocked_app_page"]

[[permission]]
identifier = "manage-statistics"
description = "Export or delete local usage statistics after an explicit user action."
commands.allow = ["export_statistics", "delete_statistics"]

[[permission]]
identifier = "dns-blocking"
description = "Read and manage native DNS blocking consent, status and one-time setup."
commands.allow = ["dns_proxy_status", "get_dns_consent", "set_dns_consent", "is_native_blocking_setup_required", "setup_native_blocking"]

[[permission]]
identifier = "privileged-helper"
description = "Check, install and remove the privileged blocking helper after an explicit user action."
commands.allow = [
  "is_privileged_helper_installed",
  "install_privileged_helper",
  "uninstall_privileged_helper",
  "get_system_blocking_status",
  "flush_system_blocks",
  "restart_background_engine"
]
