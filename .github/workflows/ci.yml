name: Validate and build desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run rust:check
      - run: npm run rust:test
      - if: runner.os == 'macOS'
        run: npm run native:probe
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "src-tauri/target/${{ matrix.target }}/release/bundle/macos/VYSTRIQ.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vystriq-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
