name: Free public beta release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - id: version
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"
  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run rust:check
      - run: npm run rust:test
      - run: npm run native:probe
      - name: Build ad-hoc signed app and DMG (not notarized)
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Validate final DMG and install/start outside checkout
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          bash scripts/verify-macos-bundle.sh "$bundle/macos/VYSTRIQ.app" "$EXPECTED_ARCH"
          images=("$bundle"/dmg/*.dmg)
          [[ "${#images[@]}" -eq 1 ]]
          hdiutil verify "${images[0]}"
          mount="$RUNNER_TEMP/verify-dmg"
          mkdir -p "$mount"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bash scripts/verify-macos-bundle.sh "$mount/VYSTRIQ.app" "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/installed"
          ditto "$mount/VYSTRIQ.app" "$RUNNER_TEMP/installed/VYSTRIQ.app"
          bash scripts/verify-macos-bundle.sh "$RUNNER_TEMP/installed/VYSTRIQ.app" "$EXPECTED_ARCH"
          python3 scripts/smoke-macos.py "$RUNNER_TEMP/installed/VYSTRIQ.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run rust:check
      - run: npm run rust:test
      - run: npm run desktop:build -- --bundles nsis
      - name: Install, verify resources, start, and uninstall on runner
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    needs: [validate, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: installers
          merge-multiple: true
      - name: Publish all installers together as a public beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # An existing tag/release is never reused or overwritten.
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" && exit 1 || status=$?
          [[ "$status" -eq 2 ]] || exit 1
          cd installers
          test -f "VYSTRIQ_${VERSION}_aarch64.dmg"
          test -f "VYSTRIQ_${VERSION}_x64.dmg"
          test -f "VYSTRIQ_${VERSION}_x64-setup.exe"
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cp ../docs/INSTALLATION.md INSTALLATION.md
          cp ../docs/RELEASE_NOTES.md RELEASE_NOTES.md
          printf '\nSource commit: %s\nActions run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> RELEASE_NOTES.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --prerelease \
            --title "VYSTRIQ $VERSION — Free public beta" --notes-file RELEASE_NOTES.md \
            *.dmg *.exe SHA256SUMS.txt INSTALLATION.md
          mkdir downloaded
          gh release download "v$VERSION" --dir downloaded --pattern '*.dmg' --pattern '*.exe' --pattern SHA256SUMS.txt
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          gh release edit "v$VERSION" --draft=false --prerelease
