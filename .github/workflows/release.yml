name: Free public beta release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - id: version
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"
  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run rust:check
      - run: npm run rust:test
      - run: npm run native:probe
      - name: Build ad-hoc signed app and DMG (not notarized)
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Validate final DMG and install/start outside checkout
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          bash scripts/verify-macos-bundle.sh "$bundle/macos/Preelock.app" "$EXPECTED_ARCH"
          images=("$bundle"/dmg/*.dmg)
          [[ "${#images[@]}" -eq 1 ]]
          hdiutil verify "${images[0]}"
          mount="$RUNNER_TEMP/verify-dmg"
          mkdir -p "$mount"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bash scripts/verify-macos-bundle.sh "$mount/Preelock.app" "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/installed"
          ditto "$mount/Preelock.app" "$RUNNER_TEMP/installed/Preelock.app"
          bash scripts/verify-macos-bundle.sh "$RUNNER_TEMP/installed/Preelock.app" "$EXPECTED_ARCH"
          python3 scripts/smoke-macos.py "$RUNNER_TEMP/installed/Preelock.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run rust:check
      - run: npm run rust:test
      - run: npm run desktop:build -- --bundles nsis
      - name: Package Store MSIX using the same compiled executable
        run: ./scripts/package-msix.ps1
      - name: Record Windows certification tooling availability
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}/Windows Kits/10/App Certification Kit/appcert.exe"
          if (Test-Path $kit) {
            "WACK tool is installed; interactive signed-package certification remains a separate Windows validation step." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "WACK is not installed on this runner. MSIX structural validation ran; certification remains unverified." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Install, upgrade, verify resources, start, and uninstall on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/msix-build-info.json
          if-no-files-found: error
  publish:
    needs: [validate, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: installers
          merge-multiple: true
      - name: Publish all installers together as a public beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd installers
          # Multiple Windows upload paths retain their common target/ hierarchy.
          # Normalize it before checking names and hashing the public assets.
          mv release/bundle/nsis/*.exe .
          mv msix/*.msix msix/msix-build-info.json .
          test -f "Preelock_${VERSION}_aarch64.dmg"
          test -f "Preelock_${VERSION}_x64.dmg"
          test -f "Preelock_${VERSION}_x64-setup.exe"
          test -f "Preelock_${VERSION}_x64.msix"
          sha256sum *.dmg *.exe *.msix > SHA256SUMS.txt
          cp ../docs/RELEASE_NOTES.md RELEASE_NOTES.md
          {
            printf '\n## Installation\n\n'
            sed '1{/^# Install Preelock/d;}' ../docs/INSTALLATION.md
            printf '\n## Published installer checksums\n\n```text\n'
            cat SHA256SUMS.txt
            printf '```\n\nSource commit: %s\nActions run: https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> RELEASE_NOTES.md
          assets=(
            "Preelock_${VERSION}_aarch64.dmg"
            "Preelock_${VERSION}_x64.dmg"
            "Preelock_${VERSION}_x64-setup.exe"
            "Preelock_${VERSION}_x64.msix"
            SHA256SUMS.txt
            msix-build-info.json
          )
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --clobber "${assets[@]}"
            gh release edit "v$VERSION" --title "Preelock $VERSION — Free public beta" \
              --notes-file RELEASE_NOTES.md --draft=false --prerelease
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Preelock $VERSION — Free public beta" --notes-file RELEASE_NOTES.md \
              "${assets[@]}"
          fi
          mkdir downloaded
          gh release download "v$VERSION" --dir downloaded --pattern '*.dmg' --pattern '*.exe' --pattern '*.msix'
          cp SHA256SUMS.txt downloaded/
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          gh release edit "v$VERSION" --draft=false --prerelease
