<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1>Preelock</h1>
      <button
        id="connection-status"
        type="button"
        class="status-badge is-unpaired"
        aria-disabled="false"
      >
        <span class="status-dot" aria-hidden="true"></span>
        <span id="connection-status-text" class="status-text" aria-live="polite"
          >Not connected</span
        >
      </button>
    </header>
    <p id="incognito-warning" class="incognito-warn" role="status" hidden></p>
    <div id="pair-view" class="pair-card" hidden>
      <button
        id="pair-close"
        type="button"
        class="pair-close"
        aria-label="Close"
        title="Close"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <h2 class="pair-heading">Connect to Preelock</h2>
      <p class="pair-subtitle">
        Paste your connection code from the Preelock desktop app.
      </p>
      <form id="pair">
        <label class="sr-only" for="token">Connection code</label>
        <input
          id="token"
          type="password"
          required
          minlength="64"
          maxlength="64"
          autocomplete="off"
          placeholder="Paste 64-character connection code"
        />
        <button id="connect-btn" type="submit">Connect</button>
      </form>
      <p id="pair-status" class="warn" role="status" hidden></p>
    </div>
    <section
      id="youtube-controls"
      class="yt-controls"
      aria-labelledby="yt-controls-heading"
    >
      <div class="yt-controls-header">
        <h2 id="yt-controls-heading">YouTube Controls</h2>
        <div class="yt-controls-meta">
          <span id="yt-active-count" class="yt-count" hidden></span>
          <button id="yt-reset" type="button" class="yt-reset" hidden>
            Reset
          </button>
        </div>
      </div>
      <div id="yt-groups" class="yt-groups"></div>
    </section>
    <section
      id="website-controls"
      class="ws-controls"
      aria-labelledby="ws-controls-heading"
    >
      <div class="yt-controls-header">
        <h2 id="ws-controls-heading">Website Controls</h2>
        <span id="ws-active-count" class="yt-count" hidden></span>
      </div>
      <div id="ws-list" class="ws-list"></div>
    </section>
    <script src="youtube-controls.js"></script>
    <script src="popup.js" type="module"></script>
  </body>
</html>
