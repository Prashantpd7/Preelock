<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VYSTRIQ Focus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>VYSTRIQ Focus</h1>
    <p>Connect to the VYSTRIQ desktop app.</p>
    <form id="pair">
      <label
        >Connection code<input
          id="token"
          type="password"
          required
          minlength="64"
          maxlength="64"
          autocomplete="off" /></label
      ><button>Connect</button>
    </form>
    <button id="retry">Reconnect</button>
    <button id="self-test">Test blocking</button>
    <p id="status" role="status"></p>
    <details>
      <summary>Emergency unblock</summary>
      <p>
        Unblock this browser and stop the focus session. Connect again before
        your next session.
      </p>
      <input
        id="confirm"
        aria-label="Type END FOCUS"
        placeholder="Type END FOCUS"
      /><button id="release">Unblock browser</button>
    </details>
    <script src="popup.js" type="module"></script>
  </body>
</html>
